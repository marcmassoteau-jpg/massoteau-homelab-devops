name: Ansible Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ansible/**'

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    name: Lint Ansible playbooks and roles

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Run ansible-lint on playbooks
        run: |
          cd ansible
          ansible-lint playbooks/*.yml

      - name: Run ansible-lint on roles
        run: |
          cd ansible
          find roles -name "tasks" -type d | while read dir; do
            ansible-lint "$dir/main.yml" || true
          done
