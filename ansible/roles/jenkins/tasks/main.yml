---
# Jenkins Deployment Role - Main Tasks
# Deploys Jenkins on Kubernetes using Helm for CI/CD automation

#=============================================================================
# PRE-FLIGHT CHECKS
#=============================================================================

- name: Check if kubectl is available
  command: kubectl version --client --short
  register: kubectl_version
  changed_when: false
  failed_when: kubectl_version.rc != 0

- name: Check if Helm is available
  command: helm version --short
  register: helm_version
  changed_when: false
  failed_when: helm_version.rc != 0

- name: Verify Kubernetes cluster connectivity
  command: kubectl cluster-info
  register: cluster_info
  changed_when: false
  failed_when: cluster_info.rc != 0

- name: Display pre-flight check summary
  debug:
    msg:
      - "Pre-flight checks passed:"
      - "  kubectl: {{ kubectl_version.stdout }}"
      - "  helm: {{ helm_version.stdout }}"
      - "  Cluster: Connected"

#=============================================================================
# NAMESPACE CREATION
#=============================================================================

- name: Check if Jenkins namespace exists
  command: "kubectl get namespace {{ jenkins_namespace }}"
  register: namespace_check
  changed_when: false
  failed_when: false

- name: Create Jenkins namespace
  when: namespace_check.rc != 0 and jenkins_create_namespace
  block:
    - name: Create namespace manifest
      copy:
        dest: /tmp/jenkins-namespace.yaml
        content: |
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ jenkins_namespace }}
            labels:
              name: {{ jenkins_namespace }}
              app.kubernetes.io/name: jenkins
              app.kubernetes.io/component: ci-cd
              app.kubernetes.io/part-of: devops-platform
              environment: homelab
            annotations:
              description: "Jenkins CI/CD automation platform"
              phase: "5"
              managed-by: ansible
        mode: '0644'

    - name: Apply namespace
      command: kubectl apply -f /tmp/jenkins-namespace.yaml
      register: namespace_create
      changed_when: "'created' in namespace_create.stdout"

    - name: Display namespace creation result
      debug:
        msg: "Namespace '{{ jenkins_namespace }}' created successfully"

#=============================================================================
# HELM REPOSITORY SETUP
#=============================================================================

- name: Add Jenkins Helm repository
  command: "helm repo add jenkins {{ jenkins_chart_repo }}"
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout"
  failed_when: false

- name: Update Helm repositories
  command: helm repo update
  register: helm_repo_update
  changed_when: false

- name: Verify Jenkins chart is available
  command: "helm search repo jenkins/{{ jenkins_chart_name }}"
  register: chart_search
  changed_when: false
  failed_when: chart_search.rc != 0

- name: Display available chart
  debug:
    msg: "Jenkins chart is available in the Helm repository"

#=============================================================================
# CHECK EXISTING DEPLOYMENT
#=============================================================================

- name: Check if Jenkins is already deployed
  command: "helm list -n {{ jenkins_namespace }} -o json"
  register: helm_list
  changed_when: false
  failed_when: false

- name: Parse Helm list output
  set_fact:
    jenkins_deployed: "{{ (helm_list.stdout | from_json | selectattr('name', 'equalto', jenkins_release_name) | list | length > 0) }}"

- name: Display deployment status
  debug:
    msg: "Jenkins deployment status: {{ 'Already deployed' if jenkins_deployed else 'Not deployed' }}"

#=============================================================================
# GENERATE ADMIN PASSWORD
#=============================================================================

- name: Generate random admin password if not provided
  set_fact:
    jenkins_admin_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"
  when: jenkins_admin_password is not defined or jenkins_admin_password == ""

#=============================================================================
# GENERATE HELM VALUES
#=============================================================================

- name: Create Jenkins Helm values file
  copy:
    dest: /tmp/jenkins-values.yaml
    content: |
      # Jenkins Helm Values - Generated by Ansible
      controller:
        image:
          repository: {{ jenkins_controller_image }}
          tag: {{ jenkins_controller_tag }}
        
        adminUser: {{ jenkins_admin_user }}
        adminPassword: {{ jenkins_admin_password }}
        
        resources:
          requests:
            cpu: {{ jenkins_controller_cpu_request }}
            memory: {{ jenkins_controller_memory_request }}
          limits:
            cpu: {{ jenkins_controller_cpu_limit }}
            memory: {{ jenkins_controller_memory_limit }}
        
        javaOpts: "{{ jenkins_java_opts }}"
        
        numExecutors: {{ jenkins_controller_executors }}
        
        csrf:
          defaultCrumbIssuer:
            enabled: {{ jenkins_csrf_enabled | lower }}
        
        serviceType: ClusterIP
        
        ingress:
          enabled: {{ jenkins_ingress_enabled | lower }}
          ingressClassName: {{ jenkins_ingress_class }}
          hostName: {{ jenkins_domain }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web
          tls: []
        
        prometheus:
          enabled: {{ jenkins_metrics_enabled | lower }}
          serviceMonitorNamespace: {{ jenkins_namespace }}
        
        {% if jenkins_install_plugins %}
        installPlugins:
        {% for plugin in jenkins_plugins %}
          - {{ plugin }}
        {% endfor %}
        {% endif %}
        
        {% if jenkins_jcasc_enabled %}
        JCasC:
          defaultConfig: true
          configScripts:
            welcome-message: |
              jenkins:
                systemMessage: "{{ jenkins_system_message }}"
            
            builds-retention: |
              jenkins:
                disabledAdministrativeMonitors:
                  - "hudson.diagnosis.ReverseProxySetupMonitor"
                buildDiscarders:
                  defaultDiscarder:
                    strategy:
                      logRotator:
                        daysToKeep: {{ jenkins_artifact_days_to_keep }}
                        numToKeep: {{ jenkins_num_builds_to_keep }}
            
            security: |
              jenkins:
                securityRealm:
                  local:
                    allowsSignup: false
                    users:
                      - id: {{ jenkins_admin_user }}
                        password: {{ jenkins_admin_password }}
                authorizationStrategy:
                  {{ jenkins_authorization_strategy }}: {}
            
            {% if jenkins_kubernetes_plugin_enabled %}
            kubernetes-cloud: |
              jenkins:
                clouds:
                  - kubernetes:
                      name: kubernetes
                      serverUrl: "https://kubernetes.default"
                      namespace: {{ jenkins_kubernetes_namespace }}
                      jenkinsUrl: {{ jenkins_kubernetes_jenkins_url }}
                      jenkinsTunnel: {{ jenkins_release_name }}-agent.{{ jenkins_namespace }}.svc.cluster.local:50000
                      containerCapStr: "10"
                      connectTimeout: 300
                      readTimeout: 300
                      maxRequestsPerHostStr: 32
                      {% if jenkins_pod_templates_enabled %}
                      templates:
                        - name: "default-agent"
                          label: "jenkins-agent"
                          nodeUsageMode: NORMAL
                          containers:
                            - name: jnlp
                              image: jenkins/inbound-agent:latest
                              alwaysPullImage: false
                              workingDir: /home/jenkins/agent
                              ttyEnabled: true
                              resourceRequestCpu: {{ jenkins_agent_cpu_request }}
                              resourceLimitCpu: {{ jenkins_agent_cpu_limit }}
                              resourceRequestMemory: {{ jenkins_agent_memory_request }}
                              resourceLimitMemory: {{ jenkins_agent_memory_limit }}
                        - name: "maven-agent"
                          label: "maven"
                          nodeUsageMode: EXCLUSIVE
                          containers:
                            - name: maven
                              image: maven:3.9-eclipse-temurin-17
                              command: "cat"
                              ttyEnabled: true
                              workingDir: /home/jenkins/agent
                        - name: "python-agent"
                          label: "python"
                          nodeUsageMode: EXCLUSIVE
                          containers:
                            - name: python
                              image: python:3.11-slim
                              command: "cat"
                              ttyEnabled: true
                              workingDir: /home/jenkins/agent
                      {% endif %}
            {% endif %}
            
            {% if jenkins_configure_gitlab %}
            gitlab-integration: |
              unclassified:
                gitLabServers:
                  servers:
                    - name: {{ jenkins_gitlab_connection_name }}
                      serverUrl: {{ jenkins_gitlab_url }}
                      credentialsId: gitlab-api-token
                      manageWebHooks: true
            {% endif %}
            
            {% if jenkins_configure_shared_library %}
            shared-library: |
              unclassified:
                globalLibraries:
                  libraries:
                    - name: {{ jenkins_shared_library_name }}
                      defaultVersion: {{ jenkins_shared_library_default_version }}
                      retriever:
                        modernSCM:
                          scm:
                            git:
                              remote: {{ jenkins_shared_library_repo }}
            {% endif %}
        {% endif %}
      
      persistence:
        enabled: {{ jenkins_persistence_enabled | lower }}
        size: {{ jenkins_persistence_size }}
        storageClass: {{ jenkins_persistence_storageclass }}
        accessMode: {{ jenkins_persistence_access_mode }}
      
      serviceAccount:
        create: {{ jenkins_serviceaccount_create | lower }}
        name: {{ jenkins_serviceaccount_name }}
      
      rbac:
        create: {{ jenkins_rbac_create | lower }}
      
      agent:
        enabled: true
        resources:
          requests:
            cpu: {{ jenkins_agent_cpu_request }}
            memory: {{ jenkins_agent_memory_request }}
          limits:
            cpu: {{ jenkins_agent_cpu_limit }}
            memory: {{ jenkins_agent_memory_limit }}
    mode: '0644'
  register: values_file

- name: Display values file location
  debug:
    msg: "Jenkins values file created at: /tmp/jenkins-values.yaml"

#=============================================================================
# DEPLOY OR UPGRADE JENKINS
#=============================================================================

- name: Deploy Jenkins (initial installation)
  when: not jenkins_deployed or jenkins_force_redeploy
  block:
    - name: Install Jenkins via Helm
      command: >
        helm install {{ jenkins_release_name }} jenkins/{{ jenkins_chart_name }}
        --namespace {{ jenkins_namespace }}
        --create-namespace
        --version {{ jenkins_chart_version }}
        --values /tmp/jenkins-values.yaml
        --timeout {{ jenkins_helm_timeout }}
        {{ '--wait' if jenkins_helm_wait else '' }}
      register: helm_install
      async: 600  # 10 minutes max
      poll: 15

    - name: Display installation progress
      debug:
        msg: "Jenkins installation completed."

- name: Upgrade Jenkins (if already deployed and not force redeploying)
  when: jenkins_deployed and not jenkins_force_redeploy
  block:
    - name: Upgrade Jenkins via Helm
      command: >
        helm upgrade {{ jenkins_release_name }} jenkins/{{ jenkins_chart_name }}
        --namespace {{ jenkins_namespace }}
        --version {{ jenkins_chart_version }}
        --values /tmp/jenkins-values.yaml
        --timeout {{ jenkins_helm_timeout }}
        {{ '--wait' if jenkins_helm_wait else '' }}
      register: helm_upgrade
      async: 600
      poll: 15

    - name: Display upgrade result
      debug:
        msg: "Jenkins upgraded successfully"

#=============================================================================
# WAIT FOR DEPLOYMENT TO BE READY
#=============================================================================

- name: Wait for Jenkins pods to be Running
  when: jenkins_wait_for_ready
  block:
    - name: Wait for Jenkins controller
      command: >
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/component=jenkins-controller
        -n {{ jenkins_namespace }}
        --timeout={{ jenkins_ready_timeout }}s
      register: controller_ready
      retries: 3
      delay: 15
      until: controller_ready.rc == 0
      failed_when: false

    - name: Check all Jenkins pods status
      command: "kubectl get pods -n {{ jenkins_namespace }}"
      register: all_pods
      changed_when: false

    - name: Display pod status
      debug:
        var: all_pods.stdout_lines

#=============================================================================
# INSTALL JENKINS CLI
#=============================================================================

- name: Install Jenkins CLI
  when: jenkins_install_cli
  block:
    - name: Check if Jenkins CLI is already installed
      command: java -jar /usr/local/bin/jenkins-cli.jar -version
      register: cli_check
      changed_when: false
      failed_when: false

    - name: Download Jenkins CLI
      when: cli_check.rc != 0
      get_url:
        url: "http://{{ jenkins_domain }}/jnlpJars/jenkins-cli.jar"
        dest: /tmp/jenkins-cli.jar
        mode: '0755'
      register: cli_download
      failed_when: false
      retries: 5
      delay: 10

    - name: Install Jenkins CLI to /usr/local/bin
      when: cli_check.rc != 0 and cli_download is succeeded
      copy:
        src: /tmp/jenkins-cli.jar
        dest: /usr/local/bin/jenkins-cli.jar
        mode: '0755'
        remote_src: yes
      failed_when: false

    - name: Display CLI status
      debug:
        msg: "Jenkins CLI: {{ 'Already installed' if cli_check.rc == 0 else 'Installation attempted' }}"

#=============================================================================
# CONFIGURE GITLAB CREDENTIALS (OPTIONAL)
#=============================================================================

- name: Configure GitLab credentials
  when: jenkins_configure_gitlab and jenkins_gitlab_api_token != ""
  block:
    - name: Create GitLab API token credential
      command: >
        kubectl create secret generic gitlab-api-token
        --from-literal=token={{ jenkins_gitlab_api_token }}
        -n {{ jenkins_namespace }}
        --dry-run=client -o yaml | kubectl apply -f -
      register: gitlab_cred
      changed_when: "'created' in gitlab_cred.stdout or 'configured' in gitlab_cred.stdout"
      no_log: true

    - name: Display GitLab integration status
      debug:
        msg: "GitLab integration configured: {{ jenkins_gitlab_url }}"

#=============================================================================
# DEPLOY TRAEFIK INGRESSROUTE (OPTIONAL)
#=============================================================================

- name: Deploy Traefik IngressRoute
  when: jenkins_ingress_enabled
  block:
    - name: Check if Traefik CRDs are available
      command: kubectl get crd ingressroutes.traefik.io
      register: traefik_crd_check
      changed_when: false
      failed_when: false

    - name: Create IngressRoute from template
      template:
        src: jenkins-ingress.yaml.j2
        dest: /tmp/jenkins-ingressroute.yaml
        mode: '0644'
      when: traefik_crd_check.rc == 0

    - name: Apply IngressRoute
      command: kubectl apply -f /tmp/jenkins-ingressroute.yaml
      register: ingress_create
      changed_when: "'created' in ingress_create.stdout or 'configured' in ingress_create.stdout"
      when: traefik_crd_check.rc == 0

#=============================================================================
# POST-DEPLOYMENT ACCESS INFO
#=============================================================================

- name: Display access information
  when: jenkins_show_access_info
  debug:
    msg:
      - "================================================================"
      - "  Jenkins Deployment Completed Successfully!"
      - "================================================================"
      - ""
      - "Access Information:"
      - "  URL: http://{{ jenkins_domain }}"
      - "  Username: {{ jenkins_admin_user }}"
      - "  Password: {{ jenkins_admin_password }}"
      - ""
      - "IMPORTANT: Store the admin password securely!"
      - ""
      - "CLI Usage:"
      - "  java -jar /usr/local/bin/jenkins-cli.jar -s http://{{ jenkins_domain }} -auth {{ jenkins_admin_user }}:{{ jenkins_admin_password }} who-am-i"
      - ""
      - "================================================================"

#=============================================================================
# DISPLAY SUMMARY
#=============================================================================

- name: Get deployment summary
  command: "helm list -n {{ jenkins_namespace }}"
  register: helm_list_final
  changed_when: false

- name: Display deployment summary
  debug:
    msg:
      - "Jenkins Deployment Summary:"
      - "  Release: {{ jenkins_release_name }}"
      - "  Namespace: {{ jenkins_namespace }}"
      - "  Chart Version: {{ jenkins_chart_version }}"
      - ""
      - "{{ helm_list_final.stdout_lines }}"

- name: Display next steps
  debug:
    msg:
      - ""
      - "Next Steps:"
      - "  1. Access Jenkins at http://{{ jenkins_domain }}"
      - "  2. Login with username '{{ jenkins_admin_user }}' and password shown above"
      - "  3. Configure GitLab integration if needed"
      - "  4. Create your first pipeline"
      - "  5. Set up credentials for container registry"
      - ""
      - "For more information, see Article 15 in docs/articles/"
      - ""
