---
# Security hardening tasks for Kubernetes cluster nodes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: ['security', 'packages']

- name: Install security packages
  ansible.builtin.apt:
    name: "{{ security_packages }}"
    state: present
  tags: ['security', 'packages']

- name: Configure SSH hardening
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
    backup: yes
  notify: Restart SSH
  tags: ['security', 'ssh']

- name: Configure fail2ban
  when: security_fail2ban_enabled
  block:
    - name: Create fail2ban local configuration
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban

    - name: Ensure fail2ban is enabled and started
      ansible.builtin.systemd:
        name: fail2ban
        enabled: yes
        state: started
  tags: ['security', 'fail2ban']

- name: Configure kernel security parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-security.conf
    reload: yes
    state: present
  loop: "{{ security_kernel_params }}"
  tags: ['security', 'kernel']

- name: Configure system resource limits
  ansible.builtin.pam_limits:
    domain: "{{ item.domain }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop: "{{ security_limits }}"
  tags: ['security', 'limits']

- name: Configure unattended upgrades
  when: security_unattended_upgrades
  block:
    - name: Configure unattended-upgrades
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Enable automatic updates
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
  tags: ['security', 'updates']

- name: Configure auditd
  when: security_auditd_enabled
  block:
    - name: Ensure auditd is enabled and started
      ansible.builtin.systemd:
        name: auditd
        enabled: yes
        state: started

    - name: Add audit rules for security monitoring
      ansible.builtin.copy:
        content: |
          # Audit rule for SSH access
          -w /var/log/auth.log -p wa -k auth_log

          # Audit modifications to system files
          -w /etc/passwd -p wa -k passwd_changes
          -w /etc/group -p wa -k group_changes
          -w /etc/shadow -p wa -k shadow_changes
          -w /etc/sudoers -p wa -k sudoers_changes

          # Audit network configuration changes
          -w /etc/hosts -p wa -k network_changes
          -w /etc/network/ -p wa -k network_changes

          # Audit sudo commands
          -a always,exit -F arch=b64 -F euid=0 -S execve -k sudo_commands
          -a always,exit -F arch=b32 -F euid=0 -S execve -k sudo_commands
        dest: /etc/audit/rules.d/security.rules
        owner: root
        group: root
        mode: '0640'
      notify: Reload auditd
  tags: ['security', 'audit']

- name: Ensure AppArmor is enabled
  block:
    - name: Check AppArmor status
      ansible.builtin.command: aa-status
      register: apparmor_status
      changed_when: false
      failed_when: false

    - name: Enable AppArmor profiles
      ansible.builtin.command: aa-enforce /etc/apparmor.d/*
      when: apparmor_status.rc == 0
      changed_when: true
      failed_when: false
  tags: ['security', 'apparmor']

- name: Configure sudo timeout
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/security
    line: 'Defaults timestamp_timeout=15'
    create: yes
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  tags: ['security', 'sudo']

- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - bluetooth.service
    - iscsid.service
  failed_when: false
  tags: ['security', 'services']

- name: Set proper permissions on sensitive files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  loop:
    - /etc/ssh/sshd_config
    - /etc/shadow
    - /etc/gshadow
  tags: ['security', 'permissions']

- name: Display security hardening summary
  ansible.builtin.debug:
    msg:
      - "Security hardening completed successfully!"
      - "SSH port: {{ security_ssh_port }}"
      - "Root login: {{ 'disabled' if not security_ssh_permit_root_login else 'enabled' }}"
      - "Password authentication: {{ 'disabled' if not security_ssh_password_authentication else 'enabled' }}"
      - "fail2ban: {{ 'enabled' if security_fail2ban_enabled else 'disabled' }}"
      - "Unattended upgrades: {{ 'enabled' if security_unattended_upgrades else 'disabled' }}"
      - "Audit logging: {{ 'enabled' if security_auditd_enabled else 'disabled' }}"
  tags: ['security', 'summary']
