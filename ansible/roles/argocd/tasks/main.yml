---
# ArgoCD Deployment Role - Main Tasks
# Deploys ArgoCD on Kubernetes using Helm for GitOps continuous delivery

#=============================================================================
# PRE-FLIGHT CHECKS
#=============================================================================

- name: Check if kubectl is available
  command: kubectl version --client --short
  register: kubectl_version
  changed_when: false
  failed_when: kubectl_version.rc != 0

- name: Check if Helm is available
  command: helm version --short
  register: helm_version
  changed_when: false
  failed_when: helm_version.rc != 0

- name: Verify Kubernetes cluster connectivity
  command: kubectl cluster-info
  register: cluster_info
  changed_when: false
  failed_when: cluster_info.rc != 0

- name: Display pre-flight check summary
  debug:
    msg:
      - "Pre-flight checks passed:"
      - "  kubectl: {{ kubectl_version.stdout }}"
      - "  helm: {{ helm_version.stdout }}"
      - "  Cluster: Connected"

#=============================================================================
# NAMESPACE CREATION
#=============================================================================

- name: Check if ArgoCD namespace exists
  command: "kubectl get namespace {{ argocd_namespace }}"
  register: namespace_check
  changed_when: false
  failed_when: false

- name: Create ArgoCD namespace
  when: namespace_check.rc != 0 and argocd_create_namespace
  block:
    - name: Create namespace manifest
      copy:
        dest: /tmp/argocd-namespace.yaml
        content: |
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: {{ argocd_namespace }}
            labels:
              name: {{ argocd_namespace }}
              app.kubernetes.io/name: argocd
              app.kubernetes.io/component: gitops
              app.kubernetes.io/part-of: devops-platform
              environment: homelab
            annotations:
              description: "ArgoCD GitOps continuous delivery platform"
              phase: "6"
              managed-by: ansible
        mode: '0644'

    - name: Apply namespace
      command: kubectl apply -f /tmp/argocd-namespace.yaml
      register: namespace_create
      changed_when: "'created' in namespace_create.stdout"

    - name: Display namespace creation result
      debug:
        msg: "Namespace '{{ argocd_namespace }}' created successfully"

#=============================================================================
# HELM REPOSITORY SETUP
#=============================================================================

- name: Add ArgoCD Helm repository
  command: "helm repo add argo {{ argocd_chart_repo }}"
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout"
  failed_when: false

- name: Update Helm repositories
  command: helm repo update
  register: helm_repo_update
  changed_when: false

- name: Verify ArgoCD chart is available
  command: "helm search repo argo/{{ argocd_chart_name }}"
  register: chart_search
  changed_when: false
  failed_when: chart_search.rc != 0

- name: Display available chart
  debug:
    msg: "ArgoCD chart is available in the Helm repository"

#=============================================================================
# CHECK EXISTING DEPLOYMENT
#=============================================================================

- name: Check if ArgoCD is already deployed
  command: "helm list -n {{ argocd_namespace }} -o json"
  register: helm_list
  changed_when: false
  failed_when: false

- name: Parse Helm list output
  set_fact:
    argocd_deployed: "{{ (helm_list.stdout | from_json | selectattr('name', 'equalto', argocd_release_name) | list | length > 0) }}"

- name: Display deployment status
  debug:
    msg: "ArgoCD deployment status: {{ 'Already deployed' if argocd_deployed else 'Not deployed' }}"

#=============================================================================
# GENERATE HELM VALUES
#=============================================================================

- name: Create ArgoCD Helm values file
  copy:
    dest: /tmp/argocd-values.yaml
    content: |
      # ArgoCD Helm Values - Generated by Ansible
      global:
        domain: {{ argocd_domain }}
        logging:
          format: text
          level: info

      server:
        replicas: {{ argocd_server_replicas }}
        resources:
          requests:
            cpu: {{ argocd_server_cpu_request }}
            memory: {{ argocd_server_memory_request }}
          limits:
            cpu: {{ argocd_server_cpu_limit }}
            memory: {{ argocd_server_memory_limit }}
        extraArgs:
          - --insecure
        ingress:
          enabled: {{ argocd_ingress_enabled | lower }}
          ingressClassName: {{ argocd_ingress_class }}
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web
          hosts:
            - {{ argocd_domain }}
          tls: []
        metrics:
          enabled: {{ argocd_metrics_enabled | lower }}
          serviceMonitor:
            enabled: {{ argocd_servicemonitor_enabled | lower }}

      repoServer:
        replicas: {{ argocd_reposerver_replicas }}
        resources:
          requests:
            cpu: {{ argocd_reposerver_cpu_request }}
            memory: {{ argocd_reposerver_memory_request }}
          limits:
            cpu: {{ argocd_reposerver_cpu_limit }}
            memory: {{ argocd_reposerver_memory_limit }}
        metrics:
          enabled: {{ argocd_metrics_enabled | lower }}
          serviceMonitor:
            enabled: {{ argocd_servicemonitor_enabled | lower }}

      controller:
        replicas: {{ argocd_controller_replicas }}
        resources:
          requests:
            cpu: {{ argocd_controller_cpu_request }}
            memory: {{ argocd_controller_memory_request }}
          limits:
            cpu: {{ argocd_controller_cpu_limit }}
            memory: {{ argocd_controller_memory_limit }}
        metrics:
          enabled: {{ argocd_metrics_enabled | lower }}
          serviceMonitor:
            enabled: {{ argocd_servicemonitor_enabled | lower }}
        args:
          appResyncPeriod: "{{ argocd_app_resync_period }}"
          selfHealTimeout: "{{ argocd_self_heal_timeout }}"

      applicationSet:
        replicas: {{ argocd_appset_replicas }}
        resources:
          requests:
            cpu: {{ argocd_appset_cpu_request }}
            memory: {{ argocd_appset_memory_request }}
          limits:
            cpu: {{ argocd_appset_cpu_limit }}
            memory: {{ argocd_appset_memory_limit }}
        metrics:
          enabled: {{ argocd_metrics_enabled | lower }}
          serviceMonitor:
            enabled: {{ argocd_servicemonitor_enabled | lower }}

      redis:
        resources:
          requests:
            cpu: {{ argocd_redis_cpu_request }}
            memory: {{ argocd_redis_memory_request }}
          limits:
            cpu: {{ argocd_redis_cpu_limit }}
            memory: {{ argocd_redis_memory_limit }}

      notifications:
        enabled: {{ argocd_notifications_enabled | lower }}

      dex:
        enabled: {{ argocd_dex_enabled | lower }}

      configs:
        cm:
          statusbadge.enabled: "true"
        rbac:
          policy.default: role:readonly
          policy.csv: |
            p, role:admin, applications, *, */*, allow
            p, role:admin, clusters, *, *, allow
            p, role:admin, repositories, *, *, allow
            p, role:admin, logs, *, *, allow
            p, role:admin, exec, *, */*, allow
            g, admin, role:admin
        params:
          server.insecure: true
          controller.status.processors: "{{ argocd_status_processors }}"
          controller.operation.processors: "{{ argocd_operation_processors }}"
          controller.self.heal.timeout.seconds: "{{ argocd_self_heal_timeout }}"
    mode: '0644'
  register: values_file

- name: Display values file location
  debug:
    msg: "ArgoCD values file created at: /tmp/argocd-values.yaml"

#=============================================================================
# DEPLOY OR UPGRADE ARGOCD
#=============================================================================

- name: Deploy ArgoCD (initial installation)
  when: not argocd_deployed or argocd_force_redeploy
  block:
    - name: Install ArgoCD via Helm
      command: >
        helm install {{ argocd_release_name }} argo/{{ argocd_chart_name }}
        --namespace {{ argocd_namespace }}
        --create-namespace
        --version {{ argocd_chart_version }}
        --values /tmp/argocd-values.yaml
        --timeout {{ argocd_helm_timeout }}
        {{ '--wait' if argocd_helm_wait else '' }}
      register: helm_install
      async: 600  # 10 minutes max
      poll: 15

    - name: Display installation progress
      debug:
        msg: "ArgoCD installation completed."

- name: Upgrade ArgoCD (if already deployed and not force redeploying)
  when: argocd_deployed and not argocd_force_redeploy
  block:
    - name: Upgrade ArgoCD via Helm
      command: >
        helm upgrade {{ argocd_release_name }} argo/{{ argocd_chart_name }}
        --namespace {{ argocd_namespace }}
        --version {{ argocd_chart_version }}
        --values /tmp/argocd-values.yaml
        --timeout {{ argocd_helm_timeout }}
        {{ '--wait' if argocd_helm_wait else '' }}
      register: helm_upgrade
      async: 600
      poll: 15

    - name: Display upgrade result
      debug:
        msg: "ArgoCD upgraded successfully"

#=============================================================================
# WAIT FOR DEPLOYMENT TO BE READY
#=============================================================================

- name: Wait for ArgoCD pods to be Running
  when: argocd_wait_for_ready
  block:
    - name: Wait for ArgoCD server
      command: >
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/name=argocd-server
        -n {{ argocd_namespace }}
        --timeout={{ argocd_ready_timeout }}s
      register: server_ready
      retries: 3
      delay: 15
      until: server_ready.rc == 0
      failed_when: false

    - name: Wait for ArgoCD repo server
      command: >
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/name=argocd-repo-server
        -n {{ argocd_namespace }}
        --timeout={{ argocd_ready_timeout }}s
      register: reposerver_ready
      retries: 3
      delay: 15
      until: reposerver_ready.rc == 0
      failed_when: false

    - name: Wait for ArgoCD application controller
      command: >
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/name=argocd-application-controller
        -n {{ argocd_namespace }}
        --timeout={{ argocd_ready_timeout }}s
      register: controller_ready
      retries: 3
      delay: 15
      until: controller_ready.rc == 0
      failed_when: false

    - name: Check all ArgoCD pods status
      command: "kubectl get pods -n {{ argocd_namespace }}"
      register: all_pods
      changed_when: false

    - name: Display pod status
      debug:
        var: all_pods.stdout_lines

#=============================================================================
# INSTALL ARGOCD CLI
#=============================================================================

- name: Install ArgoCD CLI
  when: argocd_install_cli
  block:
    - name: Check if ArgoCD CLI is already installed
      command: argocd version --client --short
      register: cli_check
      changed_when: false
      failed_when: false

    - name: Download ArgoCD CLI
      when: cli_check.rc != 0
      get_url:
        url: "https://github.com/argoproj/argo-cd/releases/{{ argocd_cli_version }}/download/argocd-linux-amd64"
        dest: /tmp/argocd-cli
        mode: '0755'
      register: cli_download
      failed_when: false

    - name: Install ArgoCD CLI to /usr/local/bin
      when: cli_check.rc != 0 and cli_download is succeeded
      copy:
        src: /tmp/argocd-cli
        dest: /usr/local/bin/argocd
        mode: '0755'
        remote_src: yes
      failed_when: false

    - name: Display CLI status
      debug:
        msg: "ArgoCD CLI: {{ cli_check.stdout if cli_check.rc == 0 else 'Installation attempted' }}"

#=============================================================================
# POST-DEPLOYMENT CONFIGURATION
#=============================================================================

- name: Get initial admin password
  when: argocd_show_access_info
  block:
    - name: Wait for initial admin secret
      command: >
        kubectl get secret argocd-initial-admin-secret
        -n {{ argocd_namespace }}
        -o jsonpath="{.data.password}"
      register: admin_password_b64
      retries: 10
      delay: 10
      until: admin_password_b64.rc == 0
      failed_when: false

    - name: Decode admin password
      set_fact:
        argocd_admin_password: "{{ admin_password_b64.stdout | b64decode }}"
      when: admin_password_b64.rc == 0

    - name: Display access information
      debug:
        msg:
          - "================================================================"
          - "  ArgoCD Deployment Completed Successfully!"
          - "================================================================"
          - ""
          - "Access Information:"
          - "  URL: http://{{ argocd_domain }}"
          - "  Username: admin"
          - "  Password: {{ argocd_admin_password | default('Check secret manually') }}"
          - ""
          - "CLI Login:"
          - "  argocd login {{ argocd_domain }} --insecure"
          - ""
          - "IMPORTANT: Change the admin password after first login!"
          - "  argocd account update-password"
          - "================================================================"
      when: admin_password_b64.rc == 0

#=============================================================================
# CONFIGURE REPOSITORY (OPTIONAL)
#=============================================================================

- name: Configure GitOps repository
  when: argocd_configure_repo and argocd_repo_url is defined
  block:
    - name: Login to ArgoCD
      command: >
        argocd login {{ argocd_domain }}
        --insecure
        --username admin
        --password {{ argocd_admin_password }}
      register: argocd_login
      changed_when: false
      failed_when: false
      no_log: true

    - name: Add GitOps repository
      command: >
        argocd repo add {{ argocd_repo_url }}
        --username {{ argocd_repo_username }}
        --password {{ argocd_repo_password }}
        --insecure-skip-server-verification
      register: repo_add
      changed_when: "'successfully' in repo_add.stdout"
      failed_when: false
      no_log: true
      when: argocd_login.rc == 0

    - name: Display repository configuration result
      debug:
        msg: "GitOps repository configured: {{ argocd_repo_url }}"
      when: argocd_login.rc == 0

#=============================================================================
# CREATE DEFAULT PROJECT (OPTIONAL)
#=============================================================================

- name: Create ArgoCD project
  when: argocd_create_project
  block:
    - name: Create project manifest
      copy:
        dest: /tmp/argocd-project.yaml
        content: |
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: AppProject
          metadata:
            name: {{ argocd_project_name }}
            namespace: {{ argocd_namespace }}
          spec:
            description: {{ argocd_project_description }}
            sourceRepos:
              - '*'
            destinations:
              - namespace: '*'
                server: https://kubernetes.default.svc
            clusterResourceWhitelist:
              - group: '*'
                kind: '*'
        mode: '0644'

    - name: Apply project manifest
      command: kubectl apply -f /tmp/argocd-project.yaml
      register: project_create
      changed_when: "'created' in project_create.stdout or 'configured' in project_create.stdout"

#=============================================================================
# DEPLOY TRAEFIK INGRESSROUTE (OPTIONAL)
#=============================================================================

- name: Deploy Traefik IngressRoute
  when: argocd_ingress_enabled
  block:
    - name: Check if Traefik CRDs are available
      command: kubectl get crd ingressroutes.traefik.io
      register: traefik_crd_check
      changed_when: false
      failed_when: false

    - name: Create IngressRoute from template
      template:
        src: argocd-ingress.yaml.j2
        dest: /tmp/argocd-ingressroute.yaml
        mode: '0644'
      when: traefik_crd_check.rc == 0

    - name: Apply IngressRoute
      command: kubectl apply -f /tmp/argocd-ingressroute.yaml
      register: ingress_create
      changed_when: "'created' in ingress_create.stdout or 'configured' in ingress_create.stdout"
      when: traefik_crd_check.rc == 0

#=============================================================================
# DISPLAY SUMMARY
#=============================================================================

- name: Get deployment summary
  command: "helm list -n {{ argocd_namespace }}"
  register: helm_list_final
  changed_when: false

- name: Display deployment summary
  debug:
    msg:
      - "ArgoCD Deployment Summary:"
      - "  Release: {{ argocd_release_name }}"
      - "  Namespace: {{ argocd_namespace }}"
      - "  Chart Version: {{ argocd_chart_version }}"
      - ""
      - "{{ helm_list_final.stdout_lines }}"

- name: Display next steps
  debug:
    msg:
      - ""
      - "Next Steps:"
      - "  1. Access ArgoCD at http://{{ argocd_domain }}"
      - "  2. Login with username 'admin' and the password shown above"
      - "  3. Change the admin password"
      - "  4. Add your GitOps repository"
      - "  5. Deploy your first application with ArgoCD"
      - ""
      - "For more information, see Article 17 in docs/articles/"
      - ""
