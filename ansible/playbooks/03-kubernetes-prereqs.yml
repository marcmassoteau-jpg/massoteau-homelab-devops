---
# Playbook: Kubernetes Prerequisites
# Purpose: Install and configure prerequisites for Kubernetes
# - Common system configuration
# - Container runtime (containerd)
# - Kubernetes packages

- name: Install Kubernetes prerequisites
  hosts: k8s_cluster
  become: true
  gather_facts: true

  tasks:
    - name: Apply common system configuration
      ansible.builtin.include_role:
        name: common

    - name: Install and configure containerd runtime
      ansible.builtin.include_role:
        name: containerd

    - name: Install Kubernetes packages
      ansible.builtin.include_role:
        name: kubernetes
