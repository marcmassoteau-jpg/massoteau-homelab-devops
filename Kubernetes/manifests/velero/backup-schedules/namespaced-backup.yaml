---
# GitLab Backup Schedule
# Backs up the gitlab namespace every 6 hours
# Retention: 7 days (168 hours)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: gitlab-backup
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup-schedule
    backup-type: namespaced
    target-namespace: gitlab
spec:
  schedule: "0 */6 * * *"
  useOwnerReferencesInBackup: false
  template:
    ttl: 168h0m0s
    includedNamespaces:
      - gitlab
    excludedResources:
      - events
      - events.events.k8s.io
    snapshotVolumes: false
    defaultVolumesToFsBackup: true
    metadata:
      labels:
        backup-type: namespaced
        target-namespace: gitlab
