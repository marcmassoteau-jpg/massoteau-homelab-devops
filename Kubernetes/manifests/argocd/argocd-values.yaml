# ArgoCD Helm Chart Values - Homelab Optimized Configuration
# Compatible with ArgoCD Helm Chart v5.x (argo-cd)
# Designed for local Kubernetes cluster with limited resources
#
# Deployment: helm install argocd argo/argo-cd -f argocd-values.yaml -n argocd --create-namespace
# Upgrade: helm upgrade argocd argo/argo-cd -f argocd-values.yaml -n argocd

#=============================================================================
# GLOBAL CONFIGURATION
#=============================================================================
global:
  # Domain for ArgoCD
  domain: argocd.homelab.local

  # Logging
  logging:
    format: text
    level: info

#=============================================================================
# ARGOCD SERVER
#=============================================================================
server:
  # Single replica for homelab
  replicas: 1

  # Resource limits - optimized for homelab
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Disable TLS on ArgoCD server (Traefik handles TLS termination)
  extraArgs:
    - --insecure

  # Ingress configuration for Traefik
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - argocd.homelab.local
    tls: []  # TLS handled by Traefik if needed

  # Metrics for Prometheus (Phase 7)
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false  # Enable when Prometheus is deployed (Phase 7)
      additionalLabels:
        release: prometheus

#=============================================================================
# ARGOCD REPO SERVER
#=============================================================================
repoServer:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

#=============================================================================
# ARGOCD APPLICATION CONTROLLER
#=============================================================================
controller:
  replicas: 1

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  # Application controller settings
  args:
    # Sync interval - how often to check for changes
    appResyncPeriod: "180"
    # Self-heal interval
    selfHealTimeout: "5"

#=============================================================================
# ARGOCD APPLICATIONSET CONTROLLER
#=============================================================================
applicationSet:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

#=============================================================================
# REDIS (ArgoCD Cache)
#=============================================================================
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

#=============================================================================
# NOTIFICATIONS CONTROLLER
#=============================================================================
notifications:
  enabled: false  # Enable when notification channels configured

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

#=============================================================================
# DEX (SSO)
#=============================================================================
dex:
  enabled: false  # Disable SSO for homelab simplicity

#=============================================================================
# ARGOCD CONFIGS
#=============================================================================
configs:
  # ConfigMap settings
  cm:
    # Enable status badge
    statusbadge.enabled: "true"

    # Application health checks
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  # Repository credentials (configure after deployment)
  repositories: {}
    # homelab-gitops:
    #   url: http://gitlab.homelab.local:30080/homelab/gitops.git
    #   type: git
    #   passwordSecret:
    #     name: argocd-repo-creds
    #     key: password
    #   usernameSecret:
    #     name: argocd-repo-creds
    #     key: username

  # RBAC configuration
  rbac:
    # Default policy for authenticated users
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, logs, *, *, allow
      p, role:admin, exec, *, */*, allow
      g, admin, role:admin

  # Parameters
  params:
    # Server settings
    server.insecure: true  # Running behind Traefik

    # Controller settings
    controller.status.processors: "20"
    controller.operation.processors: "10"
    controller.self.heal.timeout.seconds: "5"

    # Repo server timeout
    reposerver.parallelism.limit: "0"
