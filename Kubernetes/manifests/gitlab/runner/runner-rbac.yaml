---
# GitLab Runner RBAC Configuration
# Defines permissions for GitLab Runner to manage CI/CD job pods

apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runner
  labels:
    name: gitlab-runner
    app.kubernetes.io/name: gitlab-runner
    app.kubernetes.io/component: ci-cd
    app.kubernetes.io/part-of: gitlab
    environment: homelab
  annotations:
    description: "GitLab Runner for CI/CD pipeline execution"
    phase: "4"

---
# ServiceAccount for GitLab Runner manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
  labels:
    app: gitlab-runner

---
# Role: Permissions within gitlab-runner namespace
# Runner needs to create/manage pods, secrets, configmaps for CI/CD jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
rules:
  # Pod management (create job pods, get logs, exec for debugging)
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/attach", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]

  # Service management (for services needed by jobs)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # Secret management (for job credentials, registry auth)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete", "update"]

  # ConfigMap management (for job configuration)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete", "update"]

  # PersistentVolumeClaim (if jobs need persistent storage)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]

---
# RoleBinding: Bind Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runner

