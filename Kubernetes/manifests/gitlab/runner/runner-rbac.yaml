---
# ResourceQuota for gitlab-runner namespace
# Prevents runaway CI/CD jobs from consuming all cluster resources
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-runner-quota
  namespace: gitlab-runner
spec:
  hard:
    # Limit total resource requests for all job pods
    requests.cpu: "8"
    requests.memory: "8Gi"

    # Limit total resource limits
    limits.cpu: "16"
    limits.memory: "16Gi"

    # Limit number of pods (concurrent jobs + runner pod)
    pods: "20"

    # Limit PVCs (if jobs create persistent volumes)
    persistentvolumeclaims: "5"

---
# LimitRange: Default resource limits for pods without explicit limits
# Prevents jobs without resource specifications from consuming unlimited resources
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-runner-limits
  namespace: gitlab-runner
spec:
  limits:
    # Default limits for containers
    - default:
        cpu: "1"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container

    # Pod-level limits (sum of all containers)
    - max:
        cpu: "4"
        memory: "4Gi"
      type: Pod

