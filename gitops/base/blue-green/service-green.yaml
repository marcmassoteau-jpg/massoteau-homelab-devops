---
# Direct access to green deployment (for testing)
apiVersion: v1
kind: Service
metadata:
  name: demo-app-green
  labels:
    app: demo-app
    version: green
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: demo-app
    version: green
