---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-canary
  labels:
    app: demo-app
    track: canary
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
      track: canary
  template:
    metadata:
      labels:
        app: demo-app
        track: canary
    spec:
      containers:
        - name: demo-app
          image: demo-app:canary
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_TRACK
              value: "canary"
            - name: APP_ENV
              value: "production"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
