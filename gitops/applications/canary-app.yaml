---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-canary
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: demo-app
    deployment-strategy: canary
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: http://gitlab.homelab.local:30080/homelab/gitops.git
    targetRevision: main
    path: base/canary

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-canary

  syncPolicy:
    # Manual sync for canary - traffic weights require careful control
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
