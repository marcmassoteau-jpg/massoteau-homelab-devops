---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging

resources:
  - ../../../base/demo-app

# Staging-specific patches
patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "staging"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "info"

commonLabels:
  environment: staging

images:
  - name: demo-app
    newName: registry.gitlab.homelab.local:30080/homelab/demo-app
    newTag: staging-latest
