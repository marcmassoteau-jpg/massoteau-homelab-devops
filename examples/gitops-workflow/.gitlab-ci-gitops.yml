# =============================================================================
# GitLab CI/CD Pipeline - Hybrid CI/CD + GitOps Workflow
# =============================================================================
#
# This pipeline demonstrates the hybrid workflow:
#   1. GitLab CI: Build -> Test -> Package (Docker image)
#   2. GitOps: Update manifests in Git -> ArgoCD syncs to cluster
#
# Stages:
#   build    - Install dependencies and build
#   test     - Run tests and linting
#   package  - Build and push Docker image
#   update-manifests - Update GitOps repo with new image tag
#
# =============================================================================

stages:
  - build
  - test
  - package
  - update-manifests

variables:
  # Application
  APP_NAME: demo-app
  APP_DIR: demo-app

  # Container Registry
  REGISTRY: registry.gitlab.homelab.local:30080
  IMAGE_NAME: ${REGISTRY}/${CI_PROJECT_NAMESPACE}/${APP_NAME}

  # GitOps Repository
  GITOPS_REPO: http://gitlab.homelab.local:30080/homelab/gitops.git
  GITOPS_BRANCH: main

  # Python
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# =============================================================================
# STAGE 1: BUILD
# =============================================================================

build:
  stage: build
  image: python:3.11-slim
  script:
    - cd ${APP_DIR}
    - pip install -r requirements.txt
    - echo "Build successful"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pip
    paths:
      - .cache/pip
  artifacts:
    paths:
      - ${APP_DIR}/
    expire_in: 1 hour

# =============================================================================
# STAGE 2: TEST
# =============================================================================

test:unit:
  stage: test
  image: python:3.11-slim
  needs:
    - build
  script:
    - cd ${APP_DIR}
    - pip install -r requirements.txt pytest pytest-cov
    - pytest test_app.py -v --cov=app --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)/'
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pip
    paths:
      - .cache/pip
    policy: pull

test:lint:
  stage: test
  image: python:3.11-slim
  needs:
    - build
  script:
    - pip install flake8
    - cd ${APP_DIR}
    - flake8 app.py --max-line-length=120 --statistics
  allow_failure: true

# =============================================================================
# STAGE 3: PACKAGE (Docker Build)
# =============================================================================

package:docker:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  needs:
    - test:unit
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY}\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context=${CI_PROJECT_DIR}/${APP_DIR}
      --dockerfile=${CI_PROJECT_DIR}/${APP_DIR}/Dockerfile
      --destination=${IMAGE_NAME}:${CI_COMMIT_SHA}
      --destination=${IMAGE_NAME}:${CI_COMMIT_REF_SLUG}-latest
      --cache=true
      --cache-ttl=24h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'

# =============================================================================
# STAGE 4: UPDATE GITOPS MANIFESTS
# =============================================================================

# Update dev manifests automatically on every main branch push
update-dev-manifests:
  stage: update-manifests
  image: alpine:3.18
  needs:
    - package:docker
  before_script:
    - apk add --no-cache git curl
    # Install kustomize
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
    - mv kustomize /usr/local/bin/
  script:
    - echo "Updating dev manifests with image ${IMAGE_NAME}:${CI_COMMIT_SHA}"

    # Clone GitOps repository
    - git clone https://${GITOPS_USER}:${GITOPS_TOKEN}@${GITOPS_REPO#http://} /tmp/gitops
    - cd /tmp/gitops

    # Update dev environment image tag
    - cd environments/dev/demo-app
    - kustomize edit set image ${IMAGE_NAME}:${CI_COMMIT_SHA}

    # Commit and push
    - git config user.email "gitlab-ci@homelab.local"
    - git config user.name "GitLab CI"
    - git add .
    - git diff --cached --quiet || git commit -m "Update dev image to ${CI_COMMIT_SHA} [skip ci]"
    - git push origin ${GITOPS_BRANCH}

    - echo "Dev manifests updated. ArgoCD will sync automatically."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: dev
    url: http://demo-app-dev.homelab.local

# Update staging manifests (manual trigger)
update-staging-manifests:
  stage: update-manifests
  image: alpine:3.18
  needs:
    - update-dev-manifests
  before_script:
    - apk add --no-cache git curl
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
    - mv kustomize /usr/local/bin/
  script:
    - echo "Promoting ${CI_COMMIT_SHA} to staging"

    - git clone https://${GITOPS_USER}:${GITOPS_TOKEN}@${GITOPS_REPO#http://} /tmp/gitops
    - cd /tmp/gitops/environments/staging/demo-app

    - kustomize edit set image ${IMAGE_NAME}:${CI_COMMIT_SHA}

    - git config user.email "gitlab-ci@homelab.local"
    - git config user.name "GitLab CI"
    - git add .
    - git diff --cached --quiet || git commit -m "Promote ${CI_COMMIT_SHA} to staging [skip ci]"
    - git push origin ${GITOPS_BRANCH}

    - echo "Staging manifests updated. ArgoCD will sync automatically."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  environment:
    name: staging
    url: http://demo-app-staging.homelab.local

# Update production manifests (manual trigger with approval)
update-prod-manifests:
  stage: update-manifests
  image: alpine:3.18
  needs:
    - update-staging-manifests
  before_script:
    - apk add --no-cache git curl
    - curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.3.0/kustomize_v5.3.0_linux_amd64.tar.gz" | tar xz
    - mv kustomize /usr/local/bin/
  script:
    - echo "Promoting ${CI_COMMIT_SHA} to production"

    - git clone https://${GITOPS_USER}:${GITOPS_TOKEN}@${GITOPS_REPO#http://} /tmp/gitops
    - cd /tmp/gitops/environments/prod/demo-app

    # Use semantic version tag for production
    - kustomize edit set image ${IMAGE_NAME}:${CI_COMMIT_TAG:-${CI_COMMIT_SHA}}

    - git config user.email "gitlab-ci@homelab.local"
    - git config user.name "GitLab CI"
    - git add .
    - git diff --cached --quiet || git commit -m "Release ${CI_COMMIT_TAG:-${CI_COMMIT_SHA}} to production [skip ci]"
    - git push origin ${GITOPS_BRANCH}

    - echo "Production manifests updated. ArgoCD will sync automatically."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  environment:
    name: production
    url: http://demo-app.homelab.local
