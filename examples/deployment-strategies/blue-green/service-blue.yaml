# Blue Service
# Direct access to blue environment for testing before traffic switch
# Useful for smoke tests and validation

apiVersion: v1
kind: Service
metadata:
  name: myapp-blue
  namespace: production
  labels:
    app: myapp
    version: blue
    service-type: test
spec:
  selector:
    app: myapp
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
