# Traefik IngressRoute with Weighted Services
# Distributes traffic between stable and canary based on weights
# Weights can be adjusted to gradually shift traffic to canary

apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: myapp-canary
  namespace: production
  labels:
    app: myapp
    deployment-strategy: canary
spec:
  entryPoints:
    - web
    - websecure
  routes:
  - match: Host(`myapp.homelab.local`)
    kind: Rule
    services:
    # Stable service (100% traffic initially)
    - name: myapp-stable
      port: 80
      weight: 100
      strategy: RoundRobin

    # Canary service (0% traffic initially)
    - name: myapp-canary
      port: 80
      weight: 0
      strategy: RoundRobin

  # Optional: TLS configuration
  # tls:
  #   secretName: myapp-tls

---
